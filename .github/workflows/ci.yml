name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
        with:
          # The full suite includes pinned historical-diff probes (for example
          # eval/kimi-reviewer-tier-probe.mjs), so a depth-1 checkout cannot
          # supply their immutable review material.
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Verify backlog completion receipts
        run: node scripts/check-backlog-receipts.mjs --release-ref "origin/${GITHUB_BASE_REF:-main}"
      - run: npm ci
      - run: npm test
      - name: Router eval (deterministic grade on goldens)
        # The full model-driven router eval runs separately (it needs a model); this prints
        # the deterministic grade of the committed golden run for CI-log visibility. The
        # contract itself is gated by test/router-eval.test.js inside `npm test` above.
        run: npm run eval:router
      - name: Verify packed tarball
        run: |
          TARBALL=$(npm pack --json | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');console.log(JSON.parse(d)[0].filename)")
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          npm init -y
          npm install "$OLDPWD/$TARBALL"
          ./node_modules/.bin/muster detect
          ./node_modules/.bin/muster doctor

  windows-smoke:
    name: Windows smoke (Node 20)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Build generated Codex assets
        run: npm run build:codex
      - name: Verify generated Codex assets
        run: npm run check:codex
      - name: Run Windows-focused tests
        run: >-
          node --test
          test/fs-util.test.js
          test/install.test.js
          test/codex-hook-node-pin.test.js
          test/harness-cowork.test.js
      - name: Smoke npm CLI shim (detect)
        run: npx --no-install muster detect .
      - name: Smoke npm CLI shim (doctor)
        run: npx --no-install muster doctor
