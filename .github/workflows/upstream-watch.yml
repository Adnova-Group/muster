name: Upstream watch

# Weekly, non-blocking: checks every merge-tracked source in vendor/manifest.yaml (items with a
# `mode`) against upstream's newest release tag, or the default-branch HEAD for an untagged
# source, and decides by blob SHA whether a file muster tracks changed since the pin. For each
# source that changed it writes `muster vendor report <source> --to <ref>`, uploads the reports
# and opens, updates or closes ONE rolling issue labelled upstream-watch. The logic lives in
# src/upstream-watch.js and scripts/upstream-watch.mjs (test/upstream-watch.test.js). It never
# edits the repository: merging an upstream is `muster vendor update`, run by a person.
#
# API cost: at most two REST calls per upstream repository (newest ref, then one tree), one when
# the pin is already the newest release, using GITHUB_TOKEN (1,000 requests/hour per repository).

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking by design: an upstream release is information, never a red main.
    continue-on-error: true
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Check every merge-tracked upstream and build reports
        run: node scripts/upstream-watch.mjs check --out watch.json

      - name: Upload the reports
        id: upload
        if: always() && hashFiles('watch.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: upstream-reports
          path: |
            watch.json
            vendor/reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Open, update or close the rolling issue
        if: always() && hashFiles('watch.json') != ''
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: node scripts/upstream-watch.mjs issue --in watch.json --artifact-url "$ARTIFACT_URL"
