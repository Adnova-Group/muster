# ----- UX skill family: merge-tracked vendored builtins (vendor/manifest.yaml sources uupm,
# intent, typeui, pfd). Listed here, not in builtins.generated.yaml, because plain
# `muster vendor` regenerates that file from non-merge-tracked sources only and would drop them.
# Roles complement rather than compete: /muster:design (impeccable) stays the design-workflow
# engine and owns DESIGN.md; uupm-ui-ux-pro-max is the default UX review and design-data skill
# (highest family rank on frontend, below the rank-50 frontend agent so implementation routing
# is unchanged); targeted fixers, intent's discipline skills and the canvases sit below it.
# Every family entry has a distinct rank per role, so equal match scores resolve the same way
# every time, and distinct keywords (searched by `muster match` and `match --skills`).
- id: uupm-ui-ux-pro-max
  kind: builtin
  roles: [frontend]
  rank: 49
  keywords: [ux, ui, usability, accessibility, landing, palette, typography, font, checklist]
  description: "Default UX review and design-data lookup: priority table, pre-delivery checklist, page and component review, searchable styles, palettes, fonts, UX guidelines and stack rules."
  provenance: { license: MIT, upstream: [nextlevelbuilder/ui-ux-pro-max-skill] }
- id: uupm-ui-styling
  kind: builtin
  roles: [frontend]
  rank: 44
  keywords: [shadcn, tailwind, styling, theme]
