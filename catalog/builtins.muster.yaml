# mattpocock-skills, superpowers-lab, addy-agent-skills). Every rank sits below its role's
# default provider (muster-scorer and muster-prompt-smith 50, the wsh builtins 50, the
# installed-first externals), so a role's chosen provider is unchanged; pipelines, the audit
# patterns and `muster match --skills` reach them by id and keywords.
