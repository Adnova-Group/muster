schema_version: "1.1"
name: content-routes-pipeline
description: >-
  A content outcome typed at /muster:plan routes to a pipeline: preflight returns
  route "pipeline" (blog-post), the command runs pipeline-args instead of muster:make-plan, and
  unattended it stops at the approval without running the pipeline.
tags: [smoke, routing]
plugins: ["../../../../plugin"]
runs: 1
context:
  scaffold_script: repo.sh
execution:
  model: haiku
  max_turns: 15
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill, Agent, AskUserQuestion]
  prompt: >-
    /muster:plan write a launch blog post announcing ISO dates in our CSV exports, under 700
    words, with at least 2 before-and-after examples
graders:
  - name: preflight-ran
    type: tool_used
    tool: Bash
    input_match: 'runtime/muster\.sh\\?"? preflight '
  # The preflight JSON sits inside a tool result string in the trace, so its quotes are \".
  - name: routed-to-pipeline
    type: regex
    target: trace
    pattern: '\\"route\\":\s*\\"pipeline\\"'
  # plan.md: route "pipeline" runs `M pipeline-args <runId>` instead of step 3.
  - name: pipeline-args-ran
    type: tool_used
    tool: Bash
    input_match: 'runtime/muster\.sh\\?"? pipeline-args '
  - name: no-code-planning
    type: tool_used
    tool: Workflow
    input_match: 'muster:make-plan'
    min: 0
    max: 0
    arm: both
  # Unattended /muster:plan stops at the approval; running the pipeline needs /muster:go.
  - name: pipeline-not-run
    type: tool_used
    tool: Workflow
    input_match: 'muster:pipeline'
    min: 0
    max: 0
    arm: both
  - name: names-the-pipeline
    type: regex
    pattern: 'blog-post'
