schema_version: "1.1"
name: pm-check-spec
description: >-
  /muster:pm check on a fixture spec runs spec-lint through the plugin's CLI wrapper and quotes
  its verdict: ISSUES with the one blocker (EXP-01.2 defined twice). pm.md: "quote the verdict
  and every issue ... Change nothing."
tags: [smoke, pm]
plugins: ["../../../../plugin"]
runs: 1
context:
  scaffold_script: spec.sh
execution:
  model: haiku
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep]
  prompt: /muster:pm check docs/specs/csv-dates/SPEC.md
graders:
  - name: spec-lint-ran
    type: tool_used
    tool: Bash
    input_match: 'runtime/muster\.sh\\?"? spec-lint [^"]*docs/specs/csv-dates/SPEC\.md'
  - name: verdict-quoted
    type: regex
    pattern: 'ISSUES'
  - name: blocker-quoted
    type: regex
    pattern: 'EXP-01\.2[\s\S]{0,200}(?:defined 2 times|defined twice)|(?:defined 2 times|defined twice)[\s\S]{0,200}EXP-01\.2'
  - name: no-pass-claim
    type: regex
    pattern: 'spec-lint[^\n]{0,80}:\s*\**PASS\b|verdict[^\n]{0,20}\**PASS\b'
    flags: i
    match: not_contains
  # "Change nothing."
  - name: spec-unchanged
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
