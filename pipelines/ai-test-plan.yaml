id: ai-test-plan
domain: pm
title: Test Plan
match: [test plan, ai test plan, qa plan, QA plan, test strategy, acceptance test plan]
upstream:
  - repo: deanpeters/product-manager-prompts
    ref: null
    path: null
    license: CC-BY-NC-SA-4.0
    relation: inspired-by
  - repo: deanpeters/Product-Manager-Skills
    ref: null
    path: null
    license: CC-BY-NC-SA-4.0
    relation: inspired-by
  - repo: phuryn/pm-skills
    ref: null
    path: null
    license: MIT
    relation: inspired-by
  - repo: anthropics/knowledge-work-plugins
    ref: null
    path: null
    license: Apache-2.0
    relation: inspired-by
  - repo: joelparkerhenderson/objectives-and-key-results
    ref: null
    path: null
    license: NONE
    relation: inspired-by
  - repo: architecture-decision-record/architecture-decision-record
    ref: null
    path: null
    license: CC-BY-NC-SA-4.0
    relation: inspired-by
phases:
  - { id: intake,       role: brainstorm,  desc: "feature under test, risks, scope, exit criteria" }
  - { id: scope,        role: author,      desc: "what's in/out; risk-based prioritization; test deliverables, environment/infra, schedule/milestones, staffing (ISO/IEC/IEEE 29119-3 sections)" }
  - { id: risk-matrix,  role: author,      desc: "H/M/L risk per feature; test depth from risk (ISO/IEC/IEEE 29119-3 — supersedes the withdrawn IEEE 829)" }
  - { id: cases,        role: author,      desc: "per risk tier: happy/boundary/negative/security; data+env+owner; suspension+resumption criteria" }
  - { id: review,       role: code-review, desc: "adversarial review + coverage gaps" }
  - { id: score,        role: score,       desc: "score vs rubric, floor principle" }
gate:
  criteria: [coverage, clarity, prioritization, test-data-strategy, suspension-criteria, done-definition]
  floor: 2
  pass_total: 14
