# Book pipeline — handles fiction AND non-fiction/business/self-improvement.
# Phase structure inspired by book-genesis (felipelobomotta-blip/book-genesis-studio,
# formerly book-genesis-v4),
# NousResearch/autonovel, Chapter Blog nonfiction outline, ProWritingAid,
# Minto Pyramid/SCQA, StoryBrand SB7, and Before-After-Bridge.
# Adopted from the upstream sweep (docs/audits): book-genesis premise-forge (scored
# variants behind a floor before any drafting) and autonovel's continuity-propagation
# ledger (edits tracked as debts against a story bible).
# Re-ported from book-genesis-studio 5.x (2026-11-10): prose-first drafting with blind
# reader checkpoints (the writer never sees the rubric), an audit that ends in a
# pass / revise / major-rewrite verdict and blocks scoring, a bounded revision loop that
# keeps a rewrite only when blind readers prefer it, and a final score that reports
# completeness and quality gates separately. This replaces the earlier per-chapter
# scored loop, which upstream retired.
