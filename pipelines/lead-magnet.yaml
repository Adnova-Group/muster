    note: '2026-11-09: commit b99599a (2026-06-07) says the blog, social, lead-magnet, newsletter, case-study and runbook rubrics were "grounded in AIDA/PAS/BAB/QUEST + E-E-A-T from high-signal sources" without naming them; no doc was committed with it. The 2026-06-08 research note (b122ed9) names later sources for most of these pipelines, recorded here as their own entries; the original set is not recoverable.'
