phases:
  - { id: intake,          role: brainstorm,  desc: "strategy context, time horizon, scope" }
  - { id: context-cascade, role: brainstorm,  desc: "map company/division objectives; which higher objective each team OKR supports" }
  - { id: objectives,      role: author,      desc: "1-3 qualitative, ambitious, outcome objectives. Draft THREE alternative OKR sets that take different routes to the same strategy (for example growth-led, retention-led, efficiency-led), each with its objectives and KRs, then recommend one and say in a line why the other two lost; keep the two alternatives in an appendix so the team can choose differently" }
  - { id: key-results,     role: author,      desc: "Verb + Metric from X to Y by Date; outcome KRs not output; baseline each (never invent one: 'not yet measured' plus a first-month measurement task). Set each KR at 60-70% confidence of reaching it, a stretch a committed team hits most of the time, and state that confidence next to the KR; a KR the team is sure to hit is a sandbagged task, one they are under 50% on is a wish. Name the guardrail metric each KR must not trade away" }
  - { id: review,          role: code-review, desc: "adversarial review + alignment check: every KR is an outcome with a baseline, a target and a stated 60-70% confidence, and three alternative sets were compared" }
  - { id: score,           role: score,       desc: "score vs rubric, floor principle" }
  - { id: humanize, role: humanize,     desc: "final pass: strip AI tells (em-dashes, banned words, robotic cadence) for human delivery" }
gate:
  criteria: [outcome-not-output, measurability, stretch-graded, alignment, focus, baseline-present]
  floor: 2
  pass_total: 14
