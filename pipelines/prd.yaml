phases:
  - { id: intake,   role: brainstorm,    desc: "clarify problem, audience, success metrics; confidence-gated clarification — keep asking until you can state the problem and metrics with high confidence before drafting, don't draft on guesses; when intake ingests raw notes/brain-dumps/transcripts, extract a structured row per item — {decision|action|fact, owner, deadline, source-anchor}; unowned actions and undated deadlines are flagged, not silently dropped" }
  - { id: framing,  role: brainstorm,    desc: "Jobs-to-be-Done framing: functional/emotional/social job + hiring criteria; proto-persona" }
  - { id: research, role: docs-research, desc: "gather evidence: market, competitor, customer context; for ingested source documents: build a section-map before searching, extract facts as {fact, anchor, confidence, needs_review} rows before synthesis, every fact anchored file+locator, anchors land in ## Sources as `- anchor: file+locator`, synthesis uses ledger rows only" }
  - { id: draft,    role: author,        desc: "draft the body: problem statement (who is affected, how often, what it costs them, the evidence); goals tied to the OKR or strategy they serve, plus explicit non-goals; target users; proposed solution; requirements ranked must/should/could/won't, each traced to a user story; one primary success metric with leading and lagging indicators and their targets, plus guardrail metrics that must not regress; dependencies, risks, open questions" }
  - { id: review,   role: code-review,   desc: "adversarial review gate (reuse review-gate) + claim-by-claim verification: each requirement/metric carries a confidence flag; unsupported claims are flagged, not asserted; before the score gate, rank every draft assumption load-bearing × evidence-strength and name the single riskiest as 'most dangerous assumption: X — because...'; unresolved high-load/low-evidence assumptions are findings" }
  - { id: score,    role: score,         desc: "score vs rubric, apply floor principle" }
  - { id: humanize, role: humanize,     desc: "final pass: strip AI tells (em-dashes, banned words, robotic cadence) for human delivery" }
gate:
  criteria: [problem-clarity, outcome-alignment, evidence, scope-discipline, dependency-clarity, primary-metric, guardrail-metrics]
  floor: 2
  pass_total: 16
