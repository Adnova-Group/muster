phases:
  - { id: intake,    role: brainstorm,    desc: "competitor, segment, deal context" }
  - { id: research,  role: docs-research, desc: "competitor facts, pricing, strengths/weaknesses (cited); date every competitor fact ('as of'); 'not listed on their pricing page' is not 'they lack it' unless their docs or a trial confirm it; state what changed, never a guessed motive; keep their claims, your interpretation and your recommendation apart" }
  - { id: win-loss,  role: docs-research, desc: "pull 3-5 recent win/loss notes; extract verbatim objections + deal factors" }
  - { id: positioning, role: author,      desc: "differentiation, landmines, trap-setting discovery questions (Know/Say/Show), why-we-win proof points; a why-we-win claim without win/loss, call or customer evidence is written as a hypothesis for reps to test; say where we lose and when the competitor is the better fit" }
  - { id: objections,  role: author,      desc: "objection handling + proof points" }
  - { id: review,    role: code-review,   desc: "adversarial review + accuracy check" }
  - { id: score,     role: score,         desc: "score vs rubric, floor principle" }
  - { id: humanize, role: humanize,     desc: "final pass: strip AI tells (em-dashes, banned words, robotic cadence) for human delivery" }
gate:
  criteria: [accuracy, differentiation, objection-coverage, single-page-fit, evidence]
  floor: 2
  pass_total: 12
