id: roadmap
domain: pm
title: Outcome Roadmap
match: [roadmap, prioritize, prioritization, roadmap prioritization, product roadmap, backlog prioritization, rice, outcome roadmap]
upstream:
  - repo: phuryn/pm-skills
    ref: 9af7bfd0bc47fdad43c2eaa7a43cd13918e7aaef
    path: null
    license: MIT
    relation: inspired-by
  - kind: article
    title: "RICE: simple prioritization for product managers"
    author: Sean McBride (Intercom)
    url: https://www.intercom.com/blog/rice-simple-prioritization-for-product-managers/
    relation: inspired-by
  - kind: article
    title: The Now-Next-Later roadmap
    author: Janna Bastow (ProdPad)
    url: https://www.prodpad.com/blog/invented-now-next-later-roadmap/
    relation: inspired-by
phases:
  - { id: generate,   role: brainstorm,    skills: [muster-roadmap], desc: "surface candidate initiatives from goals/strategy/themes (docs/product/STRATEGY.md when present), framed as outcomes: the problem to solve, for whom, and the metric it should move, never a feature list; one initiative per distinct bet" }
  - { id: research,   role: docs-research, desc: "gather evidence per initiative: market, competitor, and customer-feedback signals" }
  - { id: estimate,   role: brainstorm,    desc: "assign RICE factors with rationale (evidence-backed, not vibes); pin canonical scales — Reach = count/quarter, Impact 3/2/1/0.5/0.25, Confidence 100/80/50%, Effort in person-months, score = R×I×C/E" }
  - { id: prioritize, role: brainstorm,    skills: [muster-roadmap], desc: "write the factors to .muster/runs/<runId>/pipeline/rice.json and run the deterministic RICE scorer (muster prioritize <file> --model rice) to rank initiatives; code does the math, never hand-rank" }
  - { id: draft,      role: author,        skills: [muster-pm], desc: "outcome roadmap doc: Now/Next/Later, each item an outcome (problem, who, the metric it moves and its target) with the bet it rests on, the RICE score table and sequencing rationale. For each Now item that has no intent yet, write an INT stub at docs/intent/INT-NNNN-<slug>.md from the muster-pm INTENT template: status draft, the Job line, one Primary outcome row (baseline 'not yet measured' when unknown), at least one Guardrail row and the bet as A-01 with a kill criterion; take the next free INT number and never overwrite an existing intent. List the stubs in the roadmap" }
  - { id: review,     role: code-review,   desc: "adversarial review gate: every item names an outcome metric, not only a feature; every Now item links an intent or an INT stub" }
  - { id: score,      role: score,         desc: "score vs rubric, apply floor principle" }
  - { id: humanize,   role: humanize,      desc: "final pass: strip AI tells (em-dashes, banned words, robotic cadence) for human delivery" }
gate:
  criteria: [coverage, evidence, scoring-rigor, sequencing, outcome-alignment, feasibility]
  floor: 2
  pass_total: 14
