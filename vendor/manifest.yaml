  # ===== UX skill family: merge-tracked vendored builtins (revival stage 3) ==========
  # Same shape as gsd: `muster vendor update <source> --to <tag>` 3-way merges the adapted
  # files against their byte-exact base copies in vendor/upstream/<source>/; a verbatim FILE
  # item is a whole-file byte copy that is its own base copy (its blob must equal baseBlob,
  # checked by the doctor's vendor-sync check; plugin/builtins/{uupm,intent}-*, typeui and
  # pfd are -text in .gitattributes so Windows checkouts keep those bytes). An update to a
  # newer tag replaces verbatim files and merges adapted ones; upstream files added after the
  # pin show up only in `muster vendor report` and are vendored by hand. Pins sitting between
  # releases record `git describe --tags --long` of the ref as their tag (src/vendor-sync.js
  # DESCRIBE_RE), so the update fetch pins the commit itself.
  # Precedence for every UX builtin (stated in each file's "In muster" note):
  # project DESIGN.md > accessibility/WCAG > impeccable (/muster:design) > these skills.
  # Catalog entries live in catalog/builtins.muster.yaml (plain `muster vendor` regenerates
  # builtins.generated.yaml only from non-merge-tracked sources, which would drop them).
  - id: uupm
    kind: github
    repo: nextlevelbuilder/ui-ux-pro-max-skill
    # Pinned 2026-11-10 to upstream HEAD (newest commit, pushed 2026-11-07), 80 commits past
    # the latest release v2.15.0 (2026-08-13, a38d04c3), touching 63 files under
    # .claude/skills, so the release is not equivalent and HEAD is pinned.
    # Vendored: all seven skills under .claude/skills/ as uupm-<skill>. Not vendored:
    # cli/, gallery/, stack/, src/ (src/ui-ux-pro-max duplicates the skill's data and scripts),
    # every scripts/tests/ tree and test fixture, ui-styling/scripts/.coverage, the
    # 5.3 MB ui-styling/canvas-fonts/ (binary OFL fonts, separately licensed; the canvas
    # reference now points at project fonts or the google-fonts search domain), and the
    # catalog-refresh inputs data/phosphor-icons-upstream.json and data/google-font-licenses.json
    # with their only reader scripts/validate_data.py (a maintainer validator; search.py,
    # core.py and design_system.py never read them).
    # Adapted: the seven SKILL.md (muster frontmatter, an "In muster" note, script paths
    # rewritten from ${CLAUDE_PLUGIN_ROOT}/.claude/skills/ui-ux-pro-max/... to
    # ${CLAUDE_PLUGIN_ROOT}/builtins/uupm-ui-ux-pro-max/..., python -> python3, sibling skill
    # names -> uupm-* ids; uupm-ui-ux-pro-max's --persist step became "present the design
    # system as a DESIGN.md proposal"), and 14 references whose ../design-system/, ../brand/
    # sibling paths, skill names or the canvas-fonts directory changed. Everything else verbatim.
    # uupm-ui-styling/LICENSE.txt is the Apache-2.0 text upstream ships beside that skill;
    # it is carried verbatim with it.
