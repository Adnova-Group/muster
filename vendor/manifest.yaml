    # Re-pinned 2026-11-10: 32930818 (2026-07-30) -> 035c8f31, the skill-v4.8.2 tag commit
    # (2026-11-09); main's later commits are engine/CLI plumbing with no command change.
    # Merge-tracked since 2026-11-10 (every impeccable-* item has a `mode`): the skill and 22 of
    # its reference files are vendored as impeccable-* builtins, each an adapted copy (muster
    # frontmatter, one adaptation note, links to vendored references pointed at their builtins;
    # the upstream body is otherwise byte-exact). Byte-exact base copies live in
    # vendor/upstream/impeccable/. Not vendored: craft.md (a deprecated alias), init.md (writes
    # PRODUCT.md; muster's init writes DESIGN.md), generate.md / live.md / live-setup.md (live-browser
    # plumbing), new-work.md / visualize.md / region-map.md / component-review.md (gated on the
    # engine's concept-seed / build-phase / comp-spec verbs), routing / hooks / doctor, the mode-*
    # notes, degraded/*, and the native ios.md / android.md / *.native.md (upstream NOTICE.md credits
    # ehmo/platform-design-skills, MIT, for ios.md and android.md only, so it does not pertain here).
    # The `design` command and the design-ux audit pattern stay muster's own text (inspired-by):
    # src/design.js / vendor/impeccable.json carry the 24-workflow vocabulary, incl. `generate`.
    # Upstream tags are product-prefixed (skill-v*, engine-v*, ext-v*), none in the plain
    # vMAJOR.MINOR.PATCH form `muster vendor` fetches by, so the pin is the commit alone:
    # 035c8f31 is the skill-v4.8.2 tag commit.
