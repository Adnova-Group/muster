# Single source of truth for every external repository and work a Muster item is based on.
#
# `muster vendor` fetches the `fetch: true` sources (the default) and regenerates their
# items; `muster provenance --write` (offline) stamps every item's `upstream:` field,
# the catalog provenance summary, NOTICE / cowork/NOTICE and the generated block of
# website/about/credits.md from this file, and `muster provenance` (check mode) fails on
# drift, on an entry that names no source, and on the license gate below.
# test/provenance.test.js enforces it.
#
# Source fields:
#   kind       github | local for a repository; article | book | paper | standard |
#              talk | person for a work; unknown for an origin muster's history mentions
#              but never names (needs a `note` dated YYYY-MM-DD saying what was searched)
#   repo       owner/name, canonical (post-rename); `formerly` lists old names
#   ref        40-hex commit SHA, or omitted only for inspired-by sources
#   license    SPDX id | NONE (no license file: all rights reserved) | LicenseRef-*
#              (repositories only)
#   title, author, url   a work's name, author and https link (title or author required)
#   relation   default relation for the source's items:
#                vendored        upstream text carried essentially unchanged
#                adapted         upstream text edited
#                mechanism-port  mechanism re-implemented in new text
#                inspired-by     idea, structure or framework named, no text carried
#              a work is always inspired-by
#   copyright  the upstream copyright line, reproduced in NOTICE
#   fetch      false = attribution only, never fetched by `muster vendor` (every work)
#   licenseReview  required on a repository whose terms give Muster no right to reuse
#              text (NONE, NC, ND, proprietary) when Muster carries none of its text:
#              { date, finding: ideas-only | clean-room-rewrite, evidence }
# Item fields: id, from (upstream path; null = repository-wide), and for non-fetched
# sources `kind` (builtin | agent | skill | command | output-style | pipeline |
# codex-fallback); optional relation / ref overrides. Items of a fetched source carry
# roles and are vendored. Refs for non-fetched sources with no recorded pin were
# resolved as the upstream default-branch HEAD on the date of the Muster change that
# introduced the item; each such source says so.
sources:
