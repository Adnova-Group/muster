# Sources with no license (NONE: all rights reserved by default) or a NonCommercial
# license. test/provenance.test.js requires a waiver for each, and fails any NONE
# source that Muster carries vendored or adapted text from unless it is waived here.
# A waiver records a known risk; `pending-owner-decision` means nobody has accepted it.
licenseWaivers:
  - source: anti-ai-slop-writing
    status: pending-owner-decision
    risk: high
    reason: >-
      muster-humanizer's tell taxonomy and tiered vocabulary were adapted (text, not
      just ideas) from a repository with no license. Needs a clean-room rewrite of the
      affected vocabulary or written permission from the author.
  - source: autonovel
    status: pending-owner-decision
    risk: medium
    reason: >-
      book.yaml ports autonovel's fiction phase order and continuity-propagation
      ledger. Mechanism only; confirm no autonovel text reached the pipeline.
  - source: contains-studio-agents
    status: pending-owner-decision
    risk: low
    reason: >-
      muster-runner adopts description-trigger and per-agent constraint mechanisms
      (clean-room). Confirm no contains-studio text was carried over.
  - source: infinite-agentic-loop
    status: pending-owner-decision
    risk: low
    reason: >-
      muster-runner adopts filesystem-as-state and dispatch-template mechanisms
      (clean-room). Confirm no upstream text was carried over.
  - source: okr-guide
    status: pending-owner-decision
    risk: low
    reason: >-
      PM pipelines name the OKR framing (output vs outcome, Verb + Metric X to Y by
      Date). Framework names only; confirm no text was carried over.
  - source: run-book-template
    status: pending-owner-decision
    risk: low
    reason: >-
      runbook.yaml's phase structure was informed by this template. Structure only;
      confirm no text was carried over.
  - source: pm-prompts
    status: pending-owner-decision
    risk: low
    reason: >-
      CC BY-NC-SA 4.0 (NonCommercial). PM pipelines name its frameworks (JTBD,
      persona-first) only; confirm no text reached the pipelines.
  - source: pm-skills-deanpeters
    status: pending-owner-decision
    risk: low
    reason: >-
      CC BY-NC-SA 4.0 (NonCommercial). PM pipelines name its frameworks (8-phase PRD,
      epic hypothesis, story splitting, Gherkin ACs, PR-FAQ) only; confirm no text
      reached the pipelines.
  - source: adr
    status: pending-owner-decision
    risk: low
    reason: >-
      CC BY-NC-SA 4.0 (NonCommercial). ai-implementation-spec names the ADR sections
      (Context / Decision / Consequences / Alternatives) only.
  - source: awesome-claude-code
    status: pending-owner-decision
    risk: low
    reason: >-
      CC BY-NC-ND 4.0 (NonCommercial, NoDerivatives). Used as an index of pointers for
      the lifecycle-agent research only; nothing derived from its text.
