    kind: github
    repo: pbakaus/impeccable
    ref: 32930818a109fafa87199babe92fa8e530cff5d3
    license: Apache-2.0
    copyright: "Copyright 2025 Paul Bakaus"
    relation: inspired-by
    fetch: false
    items:
      - { id: design, kind: command, from: null }
      - { id: audit-pattern-design-ux, kind: audit-pattern, from: null }
  - id: superpowers
    kind: github
    repo: obra/superpowers
    # Merge-tracked since 2026-11-10 (src/vendor-sync.js, same model as gsd): plain `muster vendor`
    # never regenerates these items. `muster vendor update superpowers --to <tag> [--dry-run]`
    # 3-way merges every item against the byte-exact base copies in vendor/upstream/superpowers/
    # and moves this pin, the base copies and every baseBlob only when nothing conflicts;
    # `muster provenance --write` then restamps each SKILL.md's `upstream:` block.
    # Items: one builtin per skill (SKILL.md) plus one file item per supporting file the skill
    # loads from its own directory (scripts, references, prompt templates).
    #
    # Re-pinned 2026-11-10: 284be59 (v6.0.0) -> 22f0b46 (v7.0.2). The vendored bodies actually
    # forked from the locally installed plugin on 2026-06-07 (pre-v6.0.0; brainstorm's supporting
    # files from v6.1.1 d884ae0 via the Codex assets), so each item was merged with base = that
    # fork point, ours = muster, theirs = v7.0.2: every upstream change since the fork was taken,
    # including the v6.0.0 harness-neutral rewrites muster had never picked up (sp-parallel's
    # dispatch example, sp-review's template links, sp-review-recv's instruction-file wording).
    # sp-brainstorm adopts the v7.0.0-7.0.2 rebuild whole (new description, builder check).
    # Upstream now carries the four fixes muster had hand-ported (#2380, #2361, #2489, #2657),
    # so their "hand-ported" notes are gone.
    #
    # Kept muster divergence (deliberate; re-check on every update):
    #   - every SKILL.md: muster frontmatter (muster_builtin, license, generated upstream:) and
    #     the role + output-format lines after the H1 (prompt-lint ANTH-ROLE-001/ANTH-FMT-001).
    #   - sp-debug, sp-parallel, sp-review, sp-tdd: positive rephrasings of upstream's
    #     prohibitions (prompt-lint ANTH-POS-001 negative budget, 064fb78f); sp-debug keeps its
    #     ANTH-POS-001 disable comment for the epistemic-honesty rules.
    #   - supporting Markdown files: the packaging-only prompt-lint-disable header the Codex
    #     asset sync also adds (scripts/sync-codex-skill-assets.mjs REFERENCE_DIRECTIVE).
    #   - sp-brainstorm/scripts (server.cjs, helper.js, start-server.sh) and visual-companion.md:
    #     muster's local security hardening (pinned content reads, opaque-origin sandbox, view
    #     capability, owner-only session files, loopback-only + SSH tunnel for remote use instead
    #     of --host 0.0.0.0, the native-Windows Git Bash note); test/brainstorm-server-security.test.js
    #     pins it. Upstream's own changes to these files merge around it.
    # Accepted as upstream (not adapted): `superpowers:<skill>` cross-references
    # (writing-plans, test-driven-development, verification-before-completion) name the
    # upstream plugin's skills, matching the Codex lane's "prefer the enabled superpowers
    # plugin" strategy (codex/upstreams.json).
    ref: 22f0b463e7a5e579904dd6211a520321035526f7
