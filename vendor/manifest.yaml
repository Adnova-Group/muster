# Decided exceptions for repositories whose terms give Muster no right to reuse text
# (NONE, NonCommercial, NoDerivatives, proprietary) yet whose text Muster carries
# (vendored or adapted). Status permission-granted or accepted-risk; the license gate
# fails `pending-owner-decision`. A restricted source Muster takes only ideas from has
# no waiver: its `licenseReview` records the comparison instead. None remain.
licenseWaivers: []
