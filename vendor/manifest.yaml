    # `muster vendor update <id>` 3-way merges each muster file against its byte-exact base copy in
    # vendor/upstream/<id>/. Pinned to upstream HEAD on 2026-11-10 (no release tag at that commit).
    # Kept muster divergence: every SKILL.md swaps the upstream frontmatter for muster's (name kept,
    # one-line description, muster_builtin, SPDX license, generated upstream:); harness keys such as
    # disable-model-invocation, hooks, metadata and agents/openai.yaml are dropped. Bodies are
    # upstream's; cross-references by upstream skill name resolve through the kept `name:`.
    # Catalog: role frontend, ranked below the wsh frontend builtins (50) so none becomes the default
    # frontend provider. Precedence: project DESIGN.md > accessibility (jk-better-accessibility 46) >
    # impeccable > these supporting skills (44 review/writing, 42 direction/engineering, 40 motion, 30 opt-in).
    # Official GreenSock skills; their names already carry the gsap- prefix, so ids equal names.
