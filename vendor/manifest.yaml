  - id: gsd
    kind: github
    repo: open-gsd/gsd-core
    # Merge-tracked (every item has a `mode`), so plain `muster vendor` never regenerates it.
    # `muster vendor update gsd --to <tag> [--dry-run]` 3-way merges the adapted agents against
    # the byte-exact base copies in vendor/upstream/gsd/, regenerates verbatim regions, and moves
    # this pin, the base copies and every baseBlob only when nothing conflicts.
    # `muster vendor report gsd --to <tag>` writes vendor/reports/gsd-<tag>.md (per-item upstream
    # diff stats plus commits citing each item's issues); .github/workflows/upstream-watch.yml
    # runs it weekly. Items: adapted = edited copy (merge); verbatim = text carried in marked
    # `<!-- verbatim: gsd <path>:<a>-<b> -->` regions of `to` (regenerate); watch = read for
    # mechanism changes, never merged. Watch references keep a base copy so the doctor can check
    # it; the four workflow spines and the ported .cts gates (file items below) do not.
    # Re-pinned 2026-11-09 to v1.20.1 for the stage-2 agents (docs/strategy/2026-11-gsd-gap-analysis.md).
    # The three hand-ported gsd-* builtins left the manifest at this re-pin; their files go with
    # the command rewrite.
